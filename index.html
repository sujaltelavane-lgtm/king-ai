<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>King AI 👑</title><style>
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif;height:100vh}main{max-width:820px;margin:auto;height:100vh;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #292a31;font-weight:700}.chat{flex:1;overflow:auto;padding:25px 15px 120px}.msg{display:flex;gap:10px;margin:18px 0;line-height:1.5}.a{width:32px;height:32px;display:grid;place-items:center;background:#25262d;border-radius:10px;flex:none}.bubble{white-space:pre-wrap;max-width:720px}.user .bubble{background:#191a20;padding:10px 14px;border-radius:14px}.box{position:fixed;bottom:0;left:0;right:0;padding:15px;background:#0b0b0f}.form{max-width:790px;margin:auto;display:flex;background:#17181e;border:1px solid #30313a;border-radius:16px;padding:8px}.form input{flex:1;background:none;border:0;outline:0;color:white;padding:10px;font-size:16px}.form button{border:0;border-radius:11px;width:44px;font-weight:800}.welcome{text-align:center;margin-top:18vh}.welcome h1{font-size:36px}
</style></head><body><main><header>King AI 👑 <small style="color:#888">bakchod edition</small></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>Bol bhai 👑</h1><p>Question puch, bakchodi kar 😂</p></div></section><div class="box"><form class="form" onsubmit="send(event)"><input id="i" placeholder="Bol bhai, kya scene hai?"><button>↑</button></form></div></main><script>
const c=document.getElementById('chat'),i=document.getElementById('i');
function add(role,t){document.getElementById('welcome')?.remove();let x=document.createElement('div');x.className='msg '+role;x.innerHTML='<div class=a>'+(role==='user'?'👑':'🤖')+'</div><div class=bubble></div>';x.querySelector('.bubble').textContent=t;c.appendChild(x);c.scrollTop=c.scrollHeight;return x}
async function send(e){e.preventDefault();let t=i.value.trim();if(!t)return;add('user',t);i.value='';let x=add('ai','Soch raha hoon bhai... 😎');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}),d=await r.json();if(!r.ok)throw Error(d.error||'AI error');x.querySelector('.bubble').textContent=d.reply}catch(err){x.querySelector('.bubble').textContent='Bhai backend mein problem aa gayi 😭\\n'+err.message}}
</script></body></html>
